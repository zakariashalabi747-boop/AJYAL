<title>AL AJYAL - نظام الموظفين والإجازات</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap');
  :root{
    --bg:#FAF6F5; --surface:#FFFFFF; --ink:#2B2B2B; --ink-soft:#6E6E6E;
    --border:#EFE1DF; --primary:#E1524F; --primary-light:#FBEAE9; --primary-dark:#702927;
    --sick:#3B5B7A; --sick-light:#E7EDF2; --emg:#C98A2C; --emg-light:#FAF0DF; --danger:#B23A48;
    --shadow-sm: 0 2px 8px rgba(43,20,18,.06);
    --shadow-md: 0 10px 28px rgba(43,20,18,.10);
    --shadow-lg: 0 16px 40px rgba(43,20,18,.16);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh;}
  input,select,textarea{font-family:'Tajawal',sans-serif;transition:border-color .15s,box-shadow .15s;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary) !important;box-shadow:0 0 0 3px rgba(225,82,79,.12);}
  ::placeholder{color:#A9A9A9;}
  button{cursor:pointer;font-family:'Tajawal',sans-serif;border:none;}
  a{color:var(--primary);}
  header.app-header{background:linear-gradient(135deg,var(--primary-dark),#4a1917);color:#fff;border-bottom:4px solid var(--primary);
    padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow-md);position:relative;z-index:5;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{height:42px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
  .brand-name{font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;line-height:1;}
  .brand-sub{font-size:11px;color:rgba(255,255,255,.8);margin-top:4px;}
  .header-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;transition:all .18s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-white{background:#fff;color:var(--primary-dark);}
  .btn-white:hover{box-shadow:0 6px 16px rgba(0,0,0,.18);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(225,82,79,.28);}
  .btn-primary:hover{background:#d4423f;box-shadow:0 6px 16px rgba(225,82,79,.4);}
  .btn-primary:disabled{opacity:.6;transform:none;cursor:default;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
  .app-header .btn-outline{color:#fff;border-color:rgba(255,255,255,.5);}
  .app-header .btn-outline:hover{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.8);}
  .btn-danger-outline{background:transparent;border:1px solid #E8C9CC;color:var(--danger);}
  .btn-danger-outline:hover{background:#FBEEEF;border-color:var(--danger);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#9c3140;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  nav.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:4px;box-shadow:var(--shadow-sm);position:relative;z-index:4;}
  nav.tabs button{background:transparent;padding:12px 16px;font-size:14px;color:var(--ink-soft);border-bottom:3px solid transparent;transition:color .15s,border-color .15s;}
  nav.tabs button:hover{color:var(--primary);}
  nav.tabs button.active{color:var(--primary);font-weight:800;border-bottom-color:var(--primary);}
  .layout{display:flex;min-height:calc(100vh - 118px);}
  @media (max-width:760px){.layout{flex-direction:column;}}
  aside.sidebar{width:300px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);padding:16px;}
  @media (max-width:760px){aside.sidebar{width:100%;border-left:none;border-bottom:1px solid var(--border);}}
  .search-wrap{position:relative;margin-bottom:14px;}
  .search-wrap input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);font-size:13px;outline:none;}
  .search-wrap svg{position:absolute;right:10px;top:9px;color:var(--ink-soft);pointer-events:none;}
  .emp-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:right;
    background:transparent;border:1px solid transparent;border-radius:9px;padding:10px;margin-bottom:6px;font-family:'Tajawal',sans-serif;transition:background .15s,border-color .15s,transform .15s;}
  .emp-row:hover{background:var(--bg);transform:translateX(-2px);}
  .emp-row.selected{background:var(--primary-light);border-color:var(--primary);}
  .emp-row.selected:hover{transform:none;}
  .emp-avatar{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    font-family:'Cairo',sans-serif;font-weight:800;font-size:13px;background:var(--border);color:var(--ink);flex-shrink:0;}
  .emp-row.selected .emp-avatar{background:var(--primary);color:#fff;}
  .emp-name{font-size:13px;font-weight:700;}
  .emp-sub{font-size:11px;color:var(--ink-soft);}
  main.content{flex:1;padding:20px;max-width:100%;}
  @media (min-width:760px){main.content{padding:28px;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s;}
  .card:hover{box-shadow:var(--shadow-md);}
  .empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px;}
  .section-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;margin:0 0 12px;}
  .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;border-top:1px dashed var(--border);margin-top:18px;padding-top:18px;}
  @media (min-width:640px){.info-grid{grid-template-columns:repeat(4,1fr);}}
  .info-field .info-label{font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;margin-bottom:3px;}
  .info-field .info-value{font-weight:700;font-size:14px;}
  .leave-cards{display:grid;grid-template-columns:1fr;gap:12px;}
  @media (min-width:640px){.leave-cards{grid-template-columns:repeat(3,1fr);}}
  .leave-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;border-top:4px solid var(--primary);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s;}
  .leave-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .leave-card .lt-title{font-weight:800;font-size:13px;margin-bottom:8px;}
  .leave-card .lt-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .leave-card label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .leave-card input[type=number]{width:100%;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;background:var(--bg);}
  .rem-pill{border-radius:8px;padding:8px 12px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;}
  table.datatable{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
  table.datatable thead tr{background:var(--primary-light);color:var(--primary-dark);}
  table.datatable th,table.datatable td{padding:10px 10px;text-align:right;}
  table.datatable tbody tr{border-top:1px solid var(--border);transition:background .15s;}
  table.datatable tbody tr:nth-child(even){background:var(--bg);}
  table.datatable tbody tr:hover{background:var(--primary-light);}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto;box-shadow:var(--shadow-sm);}
  .badge{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;}
  .modal-overlay{position:fixed;inset:0;background:rgba(30,15,14,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .modal-box{background:var(--surface);max-width:440px;width:100%;max-height:90vh;overflow-y:auto;border-radius:18px;padding:20px;box-shadow:var(--shadow-lg);animation:slideUp .2s ease;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{font-family:'Cairo',sans-serif;font-weight:800;font-size:17px;margin:0;}
  .modal-head button{background:none;color:var(--ink-soft);font-size:18px;border-radius:6px;padding:4px;transition:background .15s,color .15s;}
  .modal-head button:hover{background:var(--bg);color:var(--danger);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);font-weight:800;margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:14px;outline:none;background:var(--bg);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .icon-btn{background:none;color:var(--ink-soft);border-radius:6px;padding:4px;transition:background .15s,color .15s;}
  .icon-btn:hover{background:var(--primary-light);color:var(--primary);}
  .icon-btn.danger{color:var(--danger);}
  .icon-btn.danger:hover{background:#FBEEEF;color:var(--danger);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:var(--shadow-lg);}
  .toast.show{opacity:1;}
  .backup-note{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
  @media print{
    header, nav.tabs, aside.sidebar, .header-actions, .search-wrap{display:none !important;}
    body.printing-single > *:not(#printHost){display:none !important;}
    body.printing-single #printHost{display:block !important;padding:20px;}
  }
  #printHost{display:none;}
  @media (min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr) !important;}}
  #app > div.content{padding:20px;}
  @media (min-width:760px){#app > div.content{padding:28px;}}
  .org-wrap{text-align:center;padding:20px 10px 40px;}
  .org-hub{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--surface),var(--primary-light));
    border:2px solid var(--primary);border-radius:18px;padding:16px 30px;box-shadow:var(--shadow-md);}
  .org-hub-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;color:var(--primary-dark);}
  .org-stem{width:2px;height:26px;background:var(--border);margin:0 auto;}
  .org-connector{position:relative;height:26px;max-width:900px;margin:0 auto;}
  .org-connector-line{position:absolute;top:0;height:2px;background:var(--border);}
  .org-row{display:flex;justify-content:center;gap:16px;max-width:960px;margin:0 auto;flex-wrap:wrap;}
  .org-branch{flex:1;min-width:170px;max-width:220px;display:flex;flex-direction:column;align-items:center;}
  .org-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 14px;width:100%;
    cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .18s,transform .18s,border-color .18s;text-align:center;}
  .org-box:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--primary);}
  .org-box .org-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:var(--primary-light);margin:0 auto 10px;transition:transform .18s;}
  .org-box:hover .org-icon{transform:scale(1.08);}
  .org-box .org-name{font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;color:var(--ink);margin-bottom:4px;}
  .org-box .org-count{font-size:11px;color:var(--ink-soft);}
  .org-add-branch{border:2px dashed var(--border);background:transparent;border-radius:16px;padding:16px 14px;
    width:100%;color:var(--ink-soft);font-size:13px;font-weight:700;min-height:110px;display:flex;align-items:center;justify-content:center;transition:all .18s;}
  .org-add-branch:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
  .org-tagline{display:inline-flex;align-items:center;gap:12px;border:2px dashed var(--primary);border-radius:14px;
    padding:14px 26px;margin-top:36px;color:var(--primary-dark);font-weight:800;font-family:'Cairo',sans-serif;font-size:13px;background:var(--primary-light);}
  .login-screen{position:fixed;inset:0;background:linear-gradient(150deg,var(--primary-dark) 0%,#4a1917 55%,var(--primary) 130%);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .login-box{background:var(--surface);border-radius:20px;padding:36px 30px;max-width:360px;width:100%;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.35);animation:slideUp .3s ease;}
  .login-box img{height:52px;margin-bottom:14px;}
  .login-box .field label{text-align:right;}
  .login-box .btn-primary{padding:11px;font-size:14px;}
</style>
</head>

<script>
/* ============== SUPABASE CONFIG ==============
   حط بيانات مشروعك هنا (من Settings -> API في لوحة Supabase) */
const SUPABASE_URL = "https://mpsjrdnfiirecujomubg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GJsre-A1-S1jeudNpLDDQA_niejdMZa";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============== DATA ============== */
const LEAVE_TYPES = {
  annual: { label: "سنوية", color: "#146356", light: "#E4EFEC" },
  sick: { label: "مرضية", color: "#3B5B7A", light: "#E7EDF2" },
  emergency: { label: "طارئة", color: "#C98A2C", light: "#FAF0DF" },
};

/* ============== STATE ============== */
let employees = [];
let page = "home";
let selectedId = null;
let leaveSelectedId = null;
let leaveDraft = null;
let departments = [];
let currentUserEmail = "";
let currentUserId = "";
let currentUserRole = null;
let currentUserEmployeeId = null;
let currentUserManagedDeptId = null;

async function loadEmployees(){
  const { data: emps, error: e1 } = await sb.from("employees").select("*").order("name");
  if(e1){ showToast("خطأ تحميل الموظفين: " + e1.message); employees = []; return; }
  const { data: balances, error: e2 } = await sb.from("leave_balances").select("*");
  if(e2){ showToast("خطأ تحميل رصيد الإجازات: " + e2.message); }
  const { data: records, error: e3 } = await sb.from("leave_records").select("*").order("start_date", { ascending: false });
  if(e3){ showToast("خطأ تحميل سجلات الإجازات: " + e3.message); }

  employees = (emps || []).map(e => {
    const dep = departments.find(d => d.id === e.department_id);
    const myBalances = (balances || []).filter(b => b.employee_id === e.id);
    const leaves = { annual: { balance: 0, taken: 0 }, sick: { balance: 0, taken: 0 }, emergency: { balance: 0, taken: 0 } };
    myBalances.forEach(b => { if(leaves[b.type]) leaves[b.type] = { balance: Number(b.balance), taken: Number(b.taken) }; });
    const myRecords = (records || []).filter(r => r.employee_id === e.id).map(r => ({
      id: r.id, type: r.type, startDate: r.start_date, endDate: r.end_date, days: Number(r.days), notes: r.notes || "",
    }));
    return {
      id: e.id,
      employeeNumber: e.employee_number || "",
      name: e.name,
      dob: e.dob || "",
      age: e.age,
      experience: e.experience,
      joinDate: e.join_date || "",
      phone: e.phone || "",
      department: dep ? dep.name : "",
      departmentId: e.department_id || "",
      notes: e.notes || "",
      leaves,
      records: myRecords,
    };
  });
}

async function loadDepartments(){
  const { data, error } = await sb.from("departments").select("*").order("name");
  if(error){ showToast("خطأ تحميل الأقسام: " + error.message); departments = []; return; }
  departments = (data || []).map(d => ({ id: d.id, name: d.name, manager: d.manager || "", parentId: d.parent_id }));
}

async function loadAll(){
  await loadDepartments();
  await loadEmployees();
}

/* ============== HELPERS ============== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
const MONTHS_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function fmtDate(d){
  if(!d) return "—";
  const date = new Date(d + "T00:00:00");
  if (isNaN(date)) return "—";
  return date.getDate() + " " + MONTHS_AR[date.getMonth()] + " " + date.getFullYear();
}
function remaining(t){ return Math.round((t.balance - t.taken) * 100) / 100; }
function daysBetween(start,end){
  if(!start||!end) return 0;
  const s=new Date(start), e=new Date(end);
  const diff = Math.round((e-s)/(1000*60*60*24)) + 1;
  return diff>0?diff:0;
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ============== MONTHLY GROUPING & CHARTS ============== */
function monthKey(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function monthLabel(key){
  const [y,m] = key.split("-");
  return MONTHS_AR[parseInt(m,10)-1] + " " + y;
}
function groupRecordsByMonth(records){
  const map = {};
  records.forEach(r=>{
    const key = monthKey(r.startDate);
    if(!map[key]) map[key] = [];
    map[key].push(r);
  });
  return Object.keys(map).sort().reverse().map(k=>({
    key: k, label: monthLabel(k),
    records: map[k].sort((a,b)=> new Date(b.startDate) - new Date(a.startDate)),
    total: map[k].reduce((s,r)=>s+r.days,0),
  }));
}
function aggregateMonthly(records){
  const map = {};
  records.forEach(r=>{
    const key = monthKey(r.startDate);
    if(!map[key]) map[key] = { annual:0, sick:0, emergency:0, total:0 };
    map[key][r.type] = (map[key][r.type]||0) + r.days;
    map[key].total += r.days;
  });
  return Object.keys(map).sort().map(k=>({ key:k, label: monthLabel(k), ...map[k] }));
}
function renderGroupedRecords(records, editable){
  if(!records || records.length===0){
    return `<div style="color:var(--ink-soft);border:1px dashed var(--border);border-radius:12px;text-align:center;padding:24px;font-size:13px;">لا توجد أيام إجازة مسجّلة بتواريخ محددة بعد.</div>`;
  }
  const groups = groupRecordsByMonth(records);
  return groups.map(g => `
    <div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;background:var(--primary-light);color:var(--primary-dark);border-radius:8px;padding:8px 12px;font-weight:800;font-size:13px;margin-bottom:6px;">
        <span>${g.label}</span><span>${g.total} يوم</span>
      </div>
      <div class="table-wrap">
        <table class="datatable">
          <thead><tr><th>النوع</th><th>من</th><th>إلى</th><th>الأيام</th><th>ملاحظات</th>${editable?'<th>إجراءات</th>':''}</tr></thead>
          <tbody>${g.records.map(r=>{
            const t = LEAVE_TYPES[r.type] || LEAVE_TYPES.annual;
            return `<tr>
              <td><span class="badge" style="background:${t.light};color:${t.color};">${t.label}</span></td>
              <td style="color:var(--ink-soft);">${fmtDate(r.startDate)}</td>
              <td style="color:var(--ink-soft);">${fmtDate(r.endDate)}</td>
              <td><strong>${r.days}</strong></td>
              <td style="color:var(--ink-soft);">${esc(r.notes)||'—'}</td>
              ${editable ? `<td>
                <button class="icon-btn" onclick='openRecordModal(${JSON.stringify(r).replace(/'/g,"&#39;")})'><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                <button class="icon-btn danger" onclick="openConfirmModal('سيتم حذف يوم الإجازة هذا نهائيًا. هل أنت متأكد؟', () => deleteRecord('${r.id}'))"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
              </td>` : ''}
            </tr>`;
          }).join("")}</tbody>
        </table>
      </div>
    </div>`).join("");
}
function svgMonthlyChart(months){
  if(!months || months.length===0){
    return `<div style="color:var(--ink-soft);text-align:center;padding:30px 10px;font-size:13px;border:1px dashed var(--border);border-radius:12px;">لا توجد بيانات كافية بعد لعرض الرسم البياني (أضف أيام إجازة بتواريخ محددة).</div>`;
  }
  const w = 680, h = 240, padL = 8, padR = 8, padB = 40, padT = 26;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;
  const maxVal = Math.max(...months.map(m=>m.total), 1);
  const gap = chartW / months.length;
  const barW = Math.min(gap * 0.55, 46);
  const colors = { annual:"#E1524F", sick:"#3B5B7A", emergency:"#C98A2C" };
  let bars = "";
  months.forEach((m,i)=>{
    const x = padL + i*gap + (gap-barW)/2;
    let yCursor = h - padB;
    ["annual","sick","emergency"].forEach(type=>{
      const val = m[type] || 0;
      if(val<=0) return;
      const segH = (val/maxVal) * chartH;
      yCursor -= segH;
      bars += `<rect x="${x.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${barW.toFixed(1)}" height="${segH.toFixed(1)}" fill="${colors[type]}" rx="2"/>`;
    });
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(yCursor-6).toFixed(1)}" font-size="11" fill="#2B2B2B" text-anchor="middle" font-weight="700">${m.total}</text>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${h-padB+16}" font-size="10" fill="#6E6E6E" text-anchor="middle">${m.label}</text>`;
  });
  bars += `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#EFE1DF" stroke-width="1"/>`;
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:260px;display:block;">${bars}</svg>
    <div style="display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;">
      <span><span style="display:inline-block;width:10px;height:10px;background:${colors.annual};border-radius:2px;margin-left:4px;"></span>سنوية</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:${colors.sick};border-radius:2px;margin-left:4px;"></span>مرضية</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:${colors.emergency};border-radius:2px;margin-left:4px;"></span>طارئة</span>
    </div>`;
}

/* ============== PRINT ============== */
function printElementOnly(elId){
  const el = document.getElementById(elId);
  if(!el){ showToast("لا يوجد شي لطباعته"); return; }
  let host = document.getElementById("printHost");
  if(!host){
    host = document.createElement("div");
    host.id = "printHost";
    document.body.appendChild(host);
  }
  host.innerHTML = "";
  host.appendChild(el.cloneNode(true));
  document.body.classList.add("printing-single");
  window.print();
}
window.addEventListener("afterprint", () => {
  document.body.classList.remove("printing-single");
  const host = document.getElementById("printHost");
  if(host) host.innerHTML = "";
});

/* ============== BACKUP (تنزيل فقط، نسخة للاطّلاع) ============== */
function downloadBackup(){
  const blob = new Blob([JSON.stringify(employees, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "aos-employees-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("تم تنزيل نسخة JSON من البيانات الحالية");
}

/* ============== EMPLOYEE CRUD ============== */
async function saveEmployee(data){
  const payload = {
    employee_number: data.employeeNumber || null,
    name: data.name,
    dob: data.dob || null,
    age: data.age === "" || data.age == null ? null : Number(data.age),
    experience: data.experience === "" || data.experience == null ? null : Number(data.experience),
    join_date: data.joinDate || null,
    phone: data.phone || null,
    department_id: data.departmentId || null,
    notes: data.notes || null,
  };
  setFormError("");
  setBtnLoading("emp-submit-btn", true, "جارِ الحفظ...", "حفظ");
  if(data.id){
    const { error } = await sb.from("employees").update(payload).eq("id", data.id);
    setBtnLoading("emp-submit-btn", false, "جارِ الحفظ...", "حفظ");
    if(error){ setFormError("فشل الحفظ: " + error.message); return; }
  } else {
    const { data: inserted, error } = await sb.from("employees").insert(payload).select().single();
    setBtnLoading("emp-submit-btn", false, "جارِ الحفظ...", "حفظ");
    if(error){ setFormError("فشلت إضافة الموظف: " + error.message); return; }
    const { error: balErr } = await sb.from("leave_balances").insert([
      { employee_id: inserted.id, type: "annual", balance: 0, taken: 0 },
      { employee_id: inserted.id, type: "sick", balance: 12, taken: 0 },
      { employee_id: inserted.id, type: "emergency", balance: 12, taken: 0 },
    ]);
    if(balErr){ setFormError("تم إضافة الموظف لكن فشل إنشاء رصيد الإجازات: " + balErr.message); return; }
    selectedId = inserted.id;
  }
  await loadEmployees();
  closeModal();
  showToast(data.id ? "تم حفظ بيانات الموظف" : "تمت إضافة الموظف بنجاح");
  renderApp();
}
async function deleteEmployee(id){
  const { error } = await sb.from("employees").delete().eq("id", id);
  if(error){ showToast("فشل الحذف: " + error.message); return; }
  if(selectedId===id) selectedId=null;
  if(leaveSelectedId===id){ leaveSelectedId=null; leaveDraft=null; }
  await loadEmployees();
  closeModal();
  renderApp();
}

/* ============== LEAVE BALANCE / RECORDS ============== */
function selectLeaveEmployee(id){
  leaveSelectedId = id;
  const emp = employees.find(e=>e.id===id);
  leaveDraft = emp ? JSON.parse(JSON.stringify(emp.leaves)) : null;
  renderApp();
}
function updateDraftField(type, field, value){
  if(!leaveDraft) return;
  leaveDraft[type][field] = parseFloat(value) || 0;
  const rem = remaining(leaveDraft[type]);
  const el = document.getElementById("rem-" + type);
  if(el) el.value = rem;
}
function updateDraftRemaining(type, value){
  if(!leaveDraft) return;
  const rem = parseFloat(value) || 0;
  // نبقي الرصيد كما هو ونحسب "المستخدم" تلقائيًا من الفرق، عشان تقدر تعدّل المتبقي مباشرة
  leaveDraft[type].taken = Math.round((leaveDraft[type].balance - rem) * 100) / 100;
  const el = document.getElementById("taken-" + type);
  if(el) el.value = leaveDraft[type].taken;
}
async function saveLeaveDraft(){
  if(!leaveSelectedId || !leaveDraft) return;
  const rows = Object.keys(leaveDraft).map(type => ({
    employee_id: leaveSelectedId, type, balance: leaveDraft[type].balance, taken: leaveDraft[type].taken,
  }));
  const { error } = await sb.from("leave_balances").upsert(rows, { onConflict: "employee_id,type" });
  if(error){ showToast("فشل الحفظ: " + error.message); return; }
  showToast("تم حفظ رصيد الإجازات");
  await loadEmployees();
  renderApp();
}
async function saveRecord(data){
  const days = daysBetween(data.startDate, data.endDate);
  const emp = employees.find(e=>e.id===leaveSelectedId);
  if(!emp) return;
  const oldRec = data.id ? (emp.records||[]).find(r=>r.id===data.id) : null;

  setFormError("");
  setBtnLoading("record-submit-btn", true, "جارِ الحفظ...", "حفظ");

  if(data.id){
    const { error } = await sb.from("leave_records").update({
      type: data.type, start_date: data.startDate, end_date: data.endDate, days, notes: data.notes || null,
    }).eq("id", data.id);
    if(error){ setBtnLoading("record-submit-btn", false, "جارِ الحفظ...", "حفظ"); setFormError("فشل الحفظ: " + error.message); return; }
  } else {
    const { error } = await sb.from("leave_records").insert({
      employee_id: leaveSelectedId, type: data.type, start_date: data.startDate, end_date: data.endDate, days, notes: data.notes || null,
    });
    if(error){ setBtnLoading("record-submit-btn", false, "جارِ الحفظ...", "حفظ"); setFormError("فشلت الإضافة: " + error.message); return; }
  }

  // اخصم/أضف تلقائيًا على "المستخدم" لنوع الإجازة بناءً على الأيام
  const leaves = JSON.parse(JSON.stringify(emp.leaves));
  if(oldRec) leaves[oldRec.type].taken = Math.max(0, Math.round((leaves[oldRec.type].taken - oldRec.days) * 100) / 100);
  leaves[data.type].taken = Math.round((leaves[data.type].taken + days) * 100) / 100;
  const { error: balErr } = await sb.from("leave_balances").upsert(
    Object.keys(leaves).map(type => ({ employee_id: leaveSelectedId, type, balance: leaves[type].balance, taken: leaves[type].taken })),
    { onConflict: "employee_id,type" }
  );
  if(balErr){ showToast("تم حفظ اليوم لكن فشل تحديث الرصيد: " + balErr.message); }

  setBtnLoading("record-submit-btn", false, "جارِ الحفظ...", "حفظ");
  await loadEmployees();
  const updatedEmp = employees.find(e=>e.id===leaveSelectedId);
  if(updatedEmp) leaveDraft = JSON.parse(JSON.stringify(updatedEmp.leaves));
  closeModal();
  showToast("تم إضافة الإجازة وخصمها من الرصيد تلقائيًا");
  renderApp();
}
async function deleteRecord(id){
  const emp = employees.find(e=>e.id===leaveSelectedId);
  const rec = emp ? (emp.records||[]).find(r=>r.id===id) : null;

  const { error } = await sb.from("leave_records").delete().eq("id", id);
  if(error){ showToast("فشل الحذف: " + error.message); return; }

  if(emp && rec){
    const leaves = JSON.parse(JSON.stringify(emp.leaves));
    leaves[rec.type].taken = Math.max(0, Math.round((leaves[rec.type].taken - rec.days) * 100) / 100);
    const { error: balErr } = await sb.from("leave_balances").upsert(
      [{ employee_id: leaveSelectedId, type: rec.type, balance: leaves[rec.type].balance, taken: leaves[rec.type].taken }],
      { onConflict: "employee_id,type" }
    );
    if(balErr){ showToast("تم الحذف لكن فشل تحديث الرصيد: " + balErr.message); }
  }

  await loadEmployees();
  const updatedEmp = employees.find(e=>e.id===leaveSelectedId);
  if(updatedEmp) leaveDraft = JSON.parse(JSON.stringify(updatedEmp.leaves));
  closeModal();
  showToast("تم حذف يوم الإجازة وإرجاعه إلى الرصيد");
  renderApp();
}

    <div class="section-title" style="margin:0;">ملخص رصيد الإجازات</div>
    <button class="btn btn-primary btn-sm" onclick="selectLeaveEmployee('${emp.id}'); setPage('leaves');">إدارة الإجازات</button>
  </div>
  <div class="leave-cards">${leaveCards}</div>
  ${emp.notes ? `<div style="color:var(--ink-soft);font-size:13px;margin-top:14px;">ملاحظات: ${esc(emp.notes)}</div>` : ""}
  `;
}

/* ============== RENDER: LEAVES PAGE ============== */
let leaveSearch = "";
function renderLeaves(){
  const filtered = employees.filter(e => !leaveSearch.trim() ||
    e.name.includes(leaveSearch) || (e.employeeNumber||"").includes(leaveSearch));
  const leaveSelected = employees.find(e=>e.id===leaveSelectedId) || null;

  return `
  <div class="layout">
    <aside class="sidebar">
      <div class="search-wrap">
        <input placeholder="ابحث باسم الموظف أو رقمه..." value="${esc(leaveSearch)}" oninput="leaveSearch=this.value; renderLeaveEmpList();">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <div id="leaveEmpListContainer">${renderLeaveEmpListHTML(filtered, leaveSelected)}</div>
    </aside>
    <main class="content">
      ${leaveSelected && leaveDraft ? renderLeaveDetail(leaveSelected) : `<div class="empty-state" style="padding:24px 0 40px;">اختر موظفًا من القائمة لعرض وتعديل رصيد إجازاته.</div>`}
      <div class="section-title">جدول الإجازات لجميع الموظفين</div>
      <div class="table-wrap">
        <table class="datatable">
          <thead><tr><th>الموظف</th><th>تاريخ الالتحاق</th><th>سنوية (رصيد/مستخدم/متبقي)</th><th>مرضية (رصيد/مستخدم/متبقي)</th><th>طارئة (رصيد/مستخدم/متبقي)</th></tr></thead>
          <tbody>
            ${employees.map(emp => `
              <tr style="cursor:pointer;" onclick="selectLeaveEmployee('${emp.id}');">
                <td><strong>${esc(emp.name)}</strong> <span style="color:var(--ink-soft);">#${esc(emp.employeeNumber)}</span></td>
                <td style="color:var(--ink-soft);">${fmtDate(emp.joinDate)}</td>
                ${Object.keys(LEAVE_TYPES).map(key=>{
                  const t=LEAVE_TYPES[key]; const l=emp.leaves[key];
                  return `<td><span style="color:${t.color};font-weight:700;">${l.balance}</span><span style="color:var(--ink-soft);"> / ${l.taken} / </span><span style="font-weight:700;">${remaining(l)}</span></td>`;
                }).join("")}
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </main>
  </div>`;
}
function renderLeaveEmpListHTML(list, selected){
  if(list.length===0) return `<div style="color:var(--ink-soft);font-size:13px;text-align:center;padding:24px 0;">لا يوجد موظفون.</div>`;
  return list.map(emp => `
    <button class="emp-row ${selected && selected.id===emp.id ? 'selected':''}" onclick="selectLeaveEmployee('${emp.id}');">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="emp-avatar">${esc(emp.name[0]||'؟')}</div>
        <div><div class="emp-name">${esc(emp.name)}</div><div class="emp-sub">#${esc(emp.employeeNumber)}</div></div>
      </div>
    </button>`).join("");
}
function renderLeaveEmpList(){
  const filtered = employees.filter(e => !leaveSearch.trim() ||
    e.name.includes(leaveSearch) || (e.employeeNumber||"").includes(leaveSearch));
  const leaveSelected = employees.find(e=>e.id===leaveSelectedId) || null;
  document.getElementById("leaveEmpListContainer").innerHTML = renderLeaveEmpListHTML(filtered, leaveSelected);
}
function renderLeaveDetail(emp){
  const cards = Object.keys(LEAVE_TYPES).map(key=>{
    const t = LEAVE_TYPES[key]; const d = leaveDraft[key];
    return `<div class="leave-card" style="border-top-color:${t.color}">
      <div class="lt-title" style="color:${t.color}">إجازة ${t.label}</div>
      <div class="lt-inputs">
        <div><label>الرصيد</label><input id="bal-${key}" type="number" step="0.25" value="${d.balance}" oninput="updateDraftField('${key}','balance',this.value)"></div>
        <div><label>المستخدم</label><input id="taken-${key}" type="number" step="0.25" value="${d.taken}" oninput="updateDraftField('${key}','taken',this.value)"></div>
      </div>
      <div class="rem-pill" style="background:${t.light};color:${t.color};">
        <span>المتبقي</span>
        <input id="rem-${key}" type="number" step="0.25" value="${remaining(d)}" oninput="updateDraftRemaining('${key}',this.value)"
          style="width:70px;text-align:center;border:1px solid ${t.color};border-radius:6px;padding:3px 4px;background:#fff;color:${t.color};font-weight:800;font-family:'Tajawal',sans-serif;">
      </div>
    </div>`;
  }).join("");

  const records = emp.records || [];
  const recordsHTML = renderGroupedRecords(records, true);
  const chartHTML = svgMonthlyChart(aggregateMonthly(records));

  return `
  <div style="margin-bottom:28px;">
    <div class="section-title">رصيد إجازات: ${esc(emp.name)}</div>
    <div class="leave-cards" style="margin-bottom:8px;">${cards}</div>
    <div class="backup-note" style="margin-bottom:10px;">"المستخدم" يتحدّث تلقائيًا كل ما تضيف/تحذف يوم إجازة بالأسفل. تقدر أيضًا تعدّله يدويًا من هنا لو عندك أيام قديمة بدون تواريخ محددة — بعدين اضغط "حفظ التعديلات".</div>
    <button class="btn btn-primary" onclick="saveLeaveDraft()">حفظ التعديلات</button>

    <div class="section-title" style="margin:24px 0 12px;">الاتجاه الشهري لإجازات ${esc(emp.name)}</div>
    <div class="card">${chartHTML}</div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px;">
      <div class="section-title" style="margin:0;">الأيام التي تم أخذها كإجازة (مقسّمة شهريًا)</div>
      <button class="btn btn-primary btn-sm" onclick="openRecordModal()">+ إضافة يوم إجازة</button>
    </div>
    ${recordsHTML}
  </div>`;
}

/* ============== RENDER: REPORTS PAGE ============== */
let reportSearch = "";
let reportEmpId = null;
function renderReports(){
  const n = employees.length;
  const avg = (arr) => arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*10)/10 : 0;
  const avgAge = avg(employees.map(e=>e.age||0).filter(Boolean));
  const avgExp = avg(employees.map(e=>e.experience||0));

  const typeTotals = {};
  Object.keys(LEAVE_TYPES).forEach(key=>{
    let balance=0, taken=0;
    employees.forEach(e=>{ balance += e.leaves[key].balance; taken += e.leaves[key].taken; });
    typeTotals[key] = { balance: Math.round(balance*100)/100, taken: Math.round(taken*100)/100, remaining: Math.round((balance-taken)*100)/100 };
  });

  const totalRecordedDays = employees.reduce((sum,e)=> sum + (e.records||[]).reduce((s,r)=>s+r.days,0), 0);

  const ranked = [...employees].sort((a,b)=>{
    const ta = Object.keys(LEAVE_TYPES).reduce((s,k)=>s+a.leaves[k].taken,0);
    const tb = Object.keys(LEAVE_TYPES).reduce((s,k)=>s+b.leaves[k].taken,0);
    return tb-ta;
  }).slice(0,8);

  const alerts = [];
  employees.forEach(e=>{
    Object.keys(LEAVE_TYPES).forEach(key=>{
      const rem = remaining(e.leaves[key]);
      if(rem < 0) alerts.push({ emp: e, type: key, rem });
    });
  });

  const statCard = (label, value) => `
    <div class="card" style="padding:16px;text-align:center;">
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">${label}</div>
      <div style="font-family:'Cairo',sans-serif;font-weight:800;font-size:24px;color:var(--primary);">${value}</div>
    </div>`;

  const typeCards = Object.keys(LEAVE_TYPES).map(key=>{
    const t = LEAVE_TYPES[key]; const s = typeTotals[key];
    return `<div class="leave-card" style="border-top-color:${t.color}">
      <div class="lt-title" style="color:${t.color}">إجازة ${t.label} (كل الموظفين)</div>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">إجمالي الرصيد: ${s.balance} · إجمالي المستخدم: ${s.taken}</div>
      <div class="rem-pill" style="background:${t.light};color:${t.color};"><span>إجمالي المتبقي</span><span>${s.remaining}</span></div>
    </div>`;
  }).join("");

  const rankedRows = ranked.map((e,i)=>{
    const total = Object.keys(LEAVE_TYPES).reduce((s,k)=>s+e.leaves[k].taken,0);
    return `<tr>
      <td>${i+1}</td>
      <td><strong>${esc(e.name)}</strong> <span style="color:var(--ink-soft);">#${esc(e.employeeNumber)}</span></td>
      <td>${e.leaves.annual.taken}</td>
      <td>${e.leaves.sick.taken}</td>
      <td>${e.leaves.emergency.taken}</td>
      <td><strong>${total}</strong></td>
    </tr>`;
  }).join("");

  const alertsHTML = alerts.length===0 ? "" : `
    <div class="card" style="border-right:4px solid var(--danger);">
      <div class="section-title" style="margin-bottom:10px;">تنبيهات: رصيد إجازة سالب</div>
      ${alerts.map(a=>`<div style="font-size:13px;padding:6px 0;border-top:1px dashed var(--border);">
        <strong>${esc(a.emp.name)}</strong> — إجازة ${LEAVE_TYPES[a.type].label}: المتبقي <strong style="color:var(--danger);">${a.rem}</strong>
      </div>`).join("")}
    </div>`;

  const q = reportSearch.trim();
  const fullList = employees.filter(e => !q || e.name.includes(q) || (e.employeeNumber||"").includes(q) || (e.department||"").includes(q));
  const fullRows = fullList.map(e=>`
    <tr>
      <td><strong>${esc(e.name)}</strong></td>
      <td>#${esc(e.employeeNumber)}</td>
      <td>${esc(e.department)||"—"}</td>
      <td>${e.age||"—"}</td>
      <td>${e.experience!=null?e.experience:"—"}</td>
      <td>${fmtDate(e.joinDate)}</td>
      <td>${esc(e.phone)||"—"}</td>
      <td>${e.leaves.annual.balance} / ${e.leaves.annual.taken} / <strong>${remaining(e.leaves.annual)}</strong></td>
      <td>${e.leaves.sick.balance} / ${e.leaves.sick.taken} / <strong>${remaining(e.leaves.sick)}</strong></td>
      <td>${e.leaves.emergency.balance} / ${e.leaves.emergency.taken} / <strong>${remaining(e.leaves.emergency)}</strong></td>
    </tr>`).join("");

  // سجل جميع أيام الإجازات المسجّلة بتواريخ محددة، لكل الموظفين
  const allRecords = [];
  employees.forEach(e => (e.records||[]).forEach(r => allRecords.push({...r, empName: e.name, empNumber: e.employeeNumber})));
  allRecords.sort((a,b)=> new Date(b.startDate) - new Date(a.startDate));
  const recordsLogHTML = allRecords.length===0 ? `
    <div style="color:var(--ink-soft);border:1px dashed var(--border);border-radius:12px;text-align:center;padding:24px;font-size:13px;">
      لا توجد أيام إجازة مسجّلة بتواريخ محددة بعد لأي موظف.
    </div>` : `
    <div class="table-wrap">
      <table class="datatable">
        <thead><tr><th>الموظف</th><th>النوع</th><th>من</th><th>إلى</th><th>الأيام</th><th>ملاحظات</th></tr></thead>
        <tbody>${allRecords.map(r=>{
          const t = LEAVE_TYPES[r.type]||LEAVE_TYPES.annual;
          return `<tr>
            <td><strong>${esc(r.empName)}</strong> <span style="color:var(--ink-soft);">#${esc(r.empNumber)}</span></td>
            <td><span class="badge" style="background:${t.light};color:${t.color};">${t.label}</span></td>
            <td style="color:var(--ink-soft);">${fmtDate(r.startDate)}</td>
            <td style="color:var(--ink-soft);">${fmtDate(r.endDate)}</td>
            <td><strong>${r.days}</strong></td>
            <td style="color:var(--ink-soft);">${esc(r.notes)||"—"}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>
    </div>`;

  const companyChartHTML = svgMonthlyChart(aggregateMonthly(allRecords));

  // ===== تقرير خاص بموظف محدد =====
  const empOptions = employees.map(e=>`<option value="${e.id}" ${reportEmpId===e.id?'selected':''}>${esc(e.name)} (#${esc(e.employeeNumber)})</option>`).join("");
  const reportEmp = employees.find(e=>e.id===reportEmpId) || null;
  let employeeReportHTML = `<div style="color:var(--ink-soft);border:1px dashed var(--border);border-radius:12px;text-align:center;padding:24px;font-size:13px;">اختر موظفًا من القائمة أعلاه لعرض تقريره الكامل.</div>`;
  if(reportEmp){
    const empChart = svgMonthlyChart(aggregateMonthly(reportEmp.records||[]));
    const empLeaveCards = Object.keys(LEAVE_TYPES).map(key=>{
      const t = LEAVE_TYPES[key]; const l = reportEmp.leaves[key];
      return `<div class="leave-card" style="border-top-color:${t.color}">
        <div class="lt-title" style="color:${t.color}">إجازة ${t.label}</div>
        <div style="font-size:12px;color:var(--ink-soft);">الرصيد: ${l.balance} · المستخدم: ${l.taken}</div>
        <div class="rem-pill" style="background:${t.light};color:${t.color};margin-top:8px;"><span>المتبقي</span><span>${remaining(l)}</span></div>
      </div>`;
    }).join("");
    const totalTaken = Object.keys(LEAVE_TYPES).reduce((s,k)=>s+reportEmp.leaves[k].taken,0);
    employeeReportHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="background:var(--primary);width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:20px;">${esc(reportEmp.name[0]||'؟')}</div>
            <div>
              <div style="font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;">${esc(reportEmp.name)}</div>
              <div style="color:var(--ink-soft);font-size:12px;">#${esc(reportEmp.employeeNumber)} ${reportEmp.department?('· '+esc(reportEmp.department)):''}</div>
            </div>
          </div>
          <div style="text-align:center;">
            <div style="font-family:'Cairo',sans-serif;font-weight:800;font-size:22px;color:var(--primary);">${totalTaken}</div>
            <div style="font-size:11px;color:var(--ink-soft);">إجمالي الأيام المستخدمة (كل الأنواع)</div>
          </div>
        </div>
        <div class="info-grid">
          <div class="info-field"><div class="info-label">العمر</div><div class="info-value">${reportEmp.age?reportEmp.age+' سنة':'—'}</div></div>
          <div class="info-field"><div class="info-label">الخبرة</div><div class="info-value">${reportEmp.experience!=null?reportEmp.experience+' سنة':'—'}</div></div>
          <div class="info-field"><div class="info-label">تاريخ الالتحاق</div><div class="info-value">${fmtDate(reportEmp.joinDate)}</div></div>
          <div class="info-field"><div class="info-label">الهاتف</div><div class="info-value">${esc(reportEmp.phone)||'—'}</div></div>
        </div>
      </div>
      <div class="leave-cards" style="margin-bottom:20px;">${empLeaveCards}</div>
      <div class="section-title">الاتجاه الشهري لإجازات هذا الموظف</div>
      <div class="card" style="margin-bottom:20px;">${empChart}</div>
      <div class="section-title">تفاصيل الأيام المأخوذة (مقسّمة شهريًا)</div>
      ${renderGroupedRecords(reportEmp.records||[], false)}
    `;
  }

  return `
  <div class="content" style="padding:0;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
      <div class="section-title" style="margin:0;">تقرير عام عن الموظفين والإجازات</div>
      <button class="btn btn-outline btn-sm" onclick="window.print()">طباعة التقرير الشامل</button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;" class="stat-grid">
      ${statCard("عدد الموظفين", n)}
      ${statCard("متوسط العمر", avgAge || "—")}
      ${statCard("متوسط سنوات الخبرة", avgExp || "—")}
      ${statCard("أيام إجازة موثّقة بتواريخ", totalRecordedDays)}
    </div>

    ${alertsHTML}

    <div class="section-title">الاتجاه الشهري لاستخدام الإجازات (كل الشركة)</div>
    <div class="card" style="margin-bottom:24px;">${companyChartHTML}</div>

    <div class="section-title">إجمالي أرصدة الإجازات حسب النوع</div>
    <div class="leave-cards" style="margin-bottom:24px;">${typeCards}</div>

    <div class="section-title">الأكثر استخدامًا للإجازات (أعلى 8)</div>
    <div class="table-wrap" style="margin-bottom:24px;">
      <table class="datatable">
        <thead><tr><th>#</th><th>الموظف</th><th>سنوية</th><th>مرضية</th><th>طارئة</th><th>الإجمالي</th></tr></thead>
        <tbody>${rankedRows || `<tr><td colspan="6" style="text-align:center;color:var(--ink-soft);">لا توجد بيانات</td></tr>`}</tbody>
      </table>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div class="section-title" style="margin:0;">تقرير خاص بموظف محدد</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <select onchange="reportEmpId=this.value; renderApp();" style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--surface);min-width:220px;">
          <option value="">اختر موظفًا...</option>
          ${empOptions}
        </select>
        ${reportEmp ? `<button class="btn btn-outline btn-sm" onclick="printElementOnly('employeeReportPrintArea')">طباعة تقرير هذا الموظف</button>` : ""}
      </div>
    </div>
    <div id="employeeReportPrintArea" style="margin-bottom:28px;">${employeeReportHTML}</div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div class="section-title" style="margin:0;">التقرير الشامل لكل موظف</div>
      <div class="search-wrap" style="margin:0;width:220px;">
        <input placeholder="ابحث بالاسم أو الرقم..." value="${esc(reportSearch)}" oninput="reportSearch=this.value; renderApp();">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
    </div>
    <div class="table-wrap" style="margin-bottom:24px;">
      <table class="datatable">
        <thead><tr><th>الاسم</th><th>الرقم</th><th>القسم</th><th>العمر</th><th>الخبرة</th><th>تاريخ الالتحاق</th><th>الهاتف</th><th>سنوية (رصيد/مستخدم/متبقي)</th><th>مرضية</th><th>طارئة</th></tr></thead>
        <tbody>${fullRows || `<tr><td colspan="10" style="text-align:center;color:var(--ink-soft);">لا يوجد موظفون مطابقون</td></tr>`}</tbody>
      </table>
    </div>

    <div class="section-title">سجل جميع أيام الإجازات (بالتاريخ الميلادي)</div>
    ${recordsLogHTML}
  </div>`;
}

/* ============== RENDER: ORG CHART PAGE ============== */

  operation: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E1524F" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
};
function pickDeptIcon(name){
  const n = (name||"").toLowerCase();
  if(/مال|finance/.test(n)) return DEPT_ICONS.finance;
  if(/موارد|بشري|hr|human/.test(n)) return DEPT_ICONS.hr;
  if(/لوجست|logistic/.test(n)) return DEPT_ICONS.logistics;
  if(/procurement|مشتريات|purchas/.test(n)) return DEPT_ICONS.procurement;
  if(/operation|تشغيل/.test(n)) return DEPT_ICONS.operation;
  if(/business|أعمال|اعمال|مبيعات/.test(n)) return DEPT_ICONS.business;
  return DEPT_ICONS.default;
}

async function updateUserRole(userId, role){
  const { error } = await sb.from("profiles").upsert({ id: userId, role });
  if(error){ showToast("فشل التحديث: " + error.message); return; }
  showToast("تم تحديث الصلاحية");
  const u = usersCache.find(x=>x.id===userId); if(u) u.role = role;
}
async function updateUserEmployee(userId, employeeId){
  const { error } = await sb.from("profiles").upsert({ id: userId, employee_id: employeeId || null });
  if(error){ showToast("فشل التحديث: " + error.message); return; }
  showToast("تم ربط الحساب بالموظف");
  const u = usersCache.find(x=>x.id===userId); if(u) u.employee_id = employeeId || null;
}
async function updateUserManagedDept(userId, deptId){
  const { error } = await sb.from("profiles").upsert({ id: userId, managed_department_id: deptId || null });
  if(error){ showToast("فشل التحديث: " + error.message); return; }
  showToast("تم تحديد القسم اللي يديره الحساب");
  const u = usersCache.find(x=>x.id===userId); if(u) u.managed_department_id = deptId || null;
}
async function submitNewUser(){
  const email = document.getElementById("nu-email").value.trim();
  const password = document.getElementById("nu-pass").value;
  const role = document.getElementById("nu-role").value;
  const employee_id = document.getElementById("nu-employee").value || null;
  const managed_department_id = document.getElementById("nu-dept").value || null;
  setFormError("");
  if(!email || !password || password.length < 6){ setFormError("أدخل بريد صحيح وكلمة مرور 6 أحرف على الأقل"); return; }
  setBtnLoading("nu-submit-btn", true, "جارِ الإضافة...", "إضافة الحساب");
  const { data: { session } } = await sb.auth.getSession();
  try {
    const { data, error } = await sb.functions.invoke("create-user", {
      body: { email, password, role, employee_id, managed_department_id },
      headers: { Authorization: "Bearer " + session.access_token },
    });
    setBtnLoading("nu-submit-btn", false, "جارِ الإضافة...", "إضافة الحساب");
    if(error || (data && data.error)){
      setFormError("فشلت الإضافة: " + (error ? error.message : data.error));
      return;
    }
    showToast("تمت إضافة الحساب بنجاح");
    document.getElementById("nu-email").value = "";
    document.getElementById("nu-pass").value = "";
    await renderUsersPage();
  } catch(e){
    setBtnLoading("nu-submit-btn", false, "جارِ الإضافة...", "إضافة الحساب");
    setFormError("فشلت الإضافة: " + e.message);
  }
}

  const count = employees.filter(e=>(e.department||"").trim()===dep.name).length;
  const children = departments.filter(d=>d.parentId===dep.id);
  const leftPct = children.length>0 ? (50/children.length) : 0;
  return `
  <div class="org-branch">
    ${withStem ? '<div class="org-stem"></div>' : ''}
    <div class="org-box" onclick="openDepartmentModal('${dep.id}')">
      <div class="org-icon">${pickDeptIcon(dep.name)}</div>

      <div class="org-count">${count} employee${count===1?"":"s"}</div>
    </div>
    ${children.length>0 ? `
      <div class="org-stem"></div>
      <div class="org-connector"><div class="org-connector-line" style="left:${leftPct}%;right:${leftPct}%;"></div></div>
      <div class="org-row">${children.map(c=>renderDeptNode(c, true)).join("")}</div>
    ` : ""}
  </div>`;
}

function addDepartment(parentId){

  document.getElementById("modalRoot").innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal();">

async function submitNewDepartment(parentId){
  const name = document.getElementById("dept-name-input").value.trim();
  const manager = document.getElementById("dept-manager-input").value.trim();
  setFormError("");
  if(!name){ setFormError("اسم القسم مطلوب"); return; }
  if(departments.some(d=>d.name.toLowerCase()===name.toLowerCase())){ setFormError("هذا القسم موجود بالفعل"); return; }
  setBtnLoading("dept-submit-btn", true, "جارِ الحفظ...", "Save");
  const { error } = await sb.from("departments").insert({ name, manager: manager || null, parent_id: parentId || null });
  setBtnLoading("dept-submit-btn", false, "جارِ الحفظ...", "Save");
  if(error){ setFormError("فشلت الإضافة: " + error.message); return; }
  await loadDepartments();
  await loadEmployees();
  closeModal();
  showToast("تمت إضافة القسم بنجاح");
  renderApp();
}
async function deleteDepartment(id){
  const dep = departments.find(d=>d.id===id);
  if(!dep) return;
  const count = employees.filter(e=>e.departmentId===id).length;
  const hasChildren = departments.some(d=>d.parentId===id);
  if(count>0){ showToast("Cannot delete a department with employees — move them first"); return; }
  if(hasChildren){ showToast("Cannot delete a department with sub-departments — remove them first"); return; }
  const { error } = await sb.from("departments").delete().eq("id", id);
  if(error){ showToast("Failed to delete: " + error.message); return; }
  await loadDepartments();
  await loadEmployees();
  closeModal();
  renderApp();
}
async function assignEmployeeToDept(empId, deptId){
  const dept = departments.find(d=>d.id===deptId);
  if(!dept) return;
  const { error } = await sb.from("employees").update({ department_id: deptId }).eq("id", empId);
  if(error){ showToast("Failed: " + error.message); return; }
  await loadEmployees();
  showToast("Employee added to " + dept.name);
  openDepartmentModal(deptId);
}

          ${unassigned.map(e => `
            <div class="emp-row" style="cursor:default;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="emp-avatar">${esc(e.name[0]||'؟')}</div>
                <div><div class="emp-name">${esc(e.name)}</div><div class="emp-sub">#${esc(e.employeeNumber)}</div></div>
              </div>
              <button class="btn btn-primary btn-sm" onclick="assignEmployeeToDept('${e.id}','${dept.id}')">+ Add</button>
            </div>`).join("")}
        </div>`;
      })()}

      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" style="flex:1;padding:11px;" onclick="closeModal(); openEmployeeModal({departmentId:'${dept.id}'})">+ New employee</button>
        <button class="btn btn-outline" style="flex:1;padding:11px;" onclick="addDepartment('${dept.id}')">+ Add sub-department</button>
      </div>
      `}
    </div>
  </div>`;
}

/* ============== MODALS ============== */
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
function setFormError(msg){
  const box = document.getElementById("modal-error-box");
  if(box){
    box.textContent = msg || "";
    box.style.display = msg ? "block" : "none";
  }
  if(msg) showToast(msg);
}
function setBtnLoading(btnId, loading, loadingText, normalText){
  const btn = document.getElementById(btnId);
  if(!btn) return;
  btn.disabled = loading;
  btn.textContent = loading ? loadingText : normalText;
}

function openEmployeeModal(emp){
  emp = emp || {};
  const deptOptions = departments.map(d => `<option value="${d.id}" ${emp.departmentId===d.id?'selected':''}>${esc(d.name)}</option>`).join("");
  document.getElementById("modalRoot").innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
    <div class="modal-box">
      <div class="modal-head"><h3>${emp.id?'تعديل بيانات الموظف':'إضافة موظف جديد'}</h3><button onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div id="modal-error-box" style="display:none;color:var(--danger);font-size:12px;margin-bottom:10px;"></div>
      <div class="field"><label>الاسم *</label><input id="f-name" value="${esc(emp.name)||''}" placeholder="اسم الموظف"></div>
      <div class="field"><label>الرقم الوظيفي</label><input id="f-empnum" value="${esc(emp.employeeNumber)||''}" placeholder="مثال: 5002"></div>
      <div class="field-row">
        <div class="field"><label>تاريخ الميلاد</label><input id="f-dob" type="date" value="${emp.dob||''}"></div>
        <div class="field"><label>العمر</label><input id="f-age" type="number" value="${emp.age!=null?emp.age:''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>سنوات الخبرة</label><input id="f-exp" type="number" value="${emp.experience!=null?emp.experience:''}"></div>
        <div class="field"><label>تاريخ الالتحاق</label><input id="f-join" type="date" value="${emp.joinDate||''}"></div>
      </div>
      <div class="field"><label>رقم الهاتف</label><input id="f-phone" value="${esc(emp.phone)||''}" placeholder="09xxxxxxxx"></div>
      <div class="field"><label>القسم</label><select id="f-dept"><option value="">— بدون قسم —</option>${deptOptions}</select></div>
      <button id="emp-submit-btn" class="btn btn-primary" style="width:100%;padding:11px;" onclick="submitEmployeeForm('${emp.id||''}')">حفظ</button>
    </div>
  </div>`;
}
function submitEmployeeForm(id){
  const name = document.getElementById("f-name").value.trim();
  setFormError("");
  if(!name){ setFormError("الاسم مطلوب"); return; }
  const data = {
    id: id || undefined,
    name,
    employeeNumber: document.getElementById("f-empnum").value.trim(),
    dob: document.getElementById("f-dob").value,
    age: document.getElementById("f-age").value ? parseInt(document.getElementById("f-age").value) : "",
    experience: document.getElementById("f-exp").value ? parseInt(document.getElementById("f-exp").value) : "",
    joinDate: document.getElementById("f-join").value,
    phone: document.getElementById("f-phone").value.trim(),
    departmentId: document.getElementById("f-dept").value || null,
  };
  saveEmployee(data);
}

function openRecordModal(rec){
  rec = rec || {};
  const typeOptions = Object.keys(LEAVE_TYPES).map(k=>`<option value="${k}" ${rec.type===k?'selected':''}>${LEAVE_TYPES[k].label}</option>`).join("");
  document.getElementById("modalRoot").innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
    <div class="modal-box">
      <div class="modal-head"><h3>${rec.id?'تعديل يوم الإجازة':'إضافة يوم إجازة'}</h3><button onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div id="modal-error-box" style="display:none;color:var(--danger);font-size:12px;margin-bottom:10px;"></div>
      <div class="field"><label>نوع الإجازة</label><select id="r-type">${typeOptions}</select></div>
      <div class="field-row">
        <div class="field"><label>تاريخ البداية</label><input id="r-start" type="date" value="${rec.startDate||''}" oninput="updateRecordDaysPreview()"></div>
        <div class="field"><label>تاريخ النهاية</label><input id="r-end" type="date" value="${rec.endDate||''}" oninput="updateRecordDaysPreview()"></div>
      </div>
      <div style="color:var(--ink-soft);font-size:13px;margin-bottom:10px;">عدد الأيام: <strong id="r-days-preview" style="color:var(--ink);">${daysBetween(rec.startDate,rec.endDate)||0}</strong></div>
      <div class="field"><label>ملاحظات (اختياري)</label><textarea id="r-notes" rows="2">${esc(rec.notes)||''}</textarea></div>
      <button id="record-submit-btn" class="btn btn-primary" style="width:100%;padding:11px;" onclick="submitRecordForm('${rec.id||''}')">حفظ</button>
    </div>
  </div>`;
}
function updateRecordDaysPreview(){
  const s=document.getElementById("r-start").value, e=document.getElementById("r-end").value;
  document.getElementById("r-days-preview").textContent = daysBetween(s,e) || 0;
}
function submitRecordForm(id){
  const startDate = document.getElementById("r-start").value;
  const endDate = document.getElementById("r-end").value;
  const days = daysBetween(startDate, endDate);
  setFormError("");
  if(!startDate || !endDate || days<=0){ setFormError("تحقق من التواريخ المدخلة"); return; }
  saveRecord({
    id: id || undefined,
    type: document.getElementById("r-type").value,
    startDate, endDate,
    notes: document.getElementById("r-notes").value.trim(),
  });
}

function openConfirmModal(message, onConfirm){
  window._confirmAction = onConfirm;
  document.getElementById("modalRoot").innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
    <div class="modal-box">
      <div class="modal-head"><h3>تأكيد الحذف</h3><button onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <p style="font-size:14px;color:var(--ink-soft);margin-bottom:16px;">${esc(message)}</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" style="flex:1;padding:11px;" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-danger" style="flex:1;padding:11px;" onclick="window._confirmAction && window._confirmAction()">حذف نهائيًا</button>
      </div>
    </div>
  </div>`;
}

/* ============== MAIN RENDER ============== */
function renderApp(){
  document.getElementById("empCount").textContent = employees.length + " موظف";
  if(page==="users"){ renderUsersPage(); return; }
  let view;
  if(page==="leaves") view = renderLeaves();
  else if(page==="reports") view = renderReports();
  else if(page==="org") view = renderOrgChart();
  else if(page==="myprofile") view = renderMyProfile();
  else if(page==="myteam") view = renderMyTeam();
  else if(page==="pending") view = renderPending();
  else view = renderHome();
  document.getElementById("app").innerHTML = view;
}
function renderAll(){ renderApp(); }
/* ============== RENDER: MY TEAM (manager, read-only) ============== */
let teamSearch = "";
let teamSelectedId = null;
function renderMyTeam(){
  const filtered = employees.filter(e => !teamSearch.trim() ||
    e.name.includes(teamSearch) || (e.employeeNumber||"").includes(teamSearch));
  const selected = employees.find(e=>e.id===teamSelectedId) || null;

  return `
  <div class="layout">
    <aside class="sidebar">
      <div class="search-wrap">
        <input placeholder="ابحث بالاسم أو الرقم..." value="${esc(teamSearch)}" oninput="teamSearch=this.value; renderApp();">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      ${filtered.length===0 ? `<div style="color:var(--ink-soft);font-size:13px;text-align:center;padding:24px 0;">لا يوجد موظفون بفريقك بعد.</div>` : `
      <div>${filtered.map(emp => `
        <button class="emp-row ${selected && selected.id===emp.id ? 'selected':''}" onclick="teamSelectedId='${emp.id}'; renderApp();">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="emp-avatar">${esc(emp.name[0]||'؟')}</div>
            <div><div class="emp-name">${esc(emp.name)}</div><div class="emp-sub">#${esc(emp.employeeNumber)}</div></div>
          </div>
        </button>`).join("")}</div>`}
    </aside>
    <main class="content">
      ${!selected ? `
      <div class="empty-state">
        <div style="font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;color:var(--ink);margin-bottom:4px;">اختر موظفًا من فريقك</div>
        <div style="font-size:13px;">لعرض بياناته ورصيد إجازاته (للقراءة فقط)</div>
      </div>` : `
      <div class="card">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px;">
          <div style="background:var(--primary);width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:24px;">${esc(selected.name[0]||'؟')}</div>
          <div>
            <div style="font-family:'Cairo',sans-serif;font-weight:800;font-size:21px;">${esc(selected.name)}</div>
            <div style="color:var(--ink-soft);font-size:13px;">${esc(selected.department)||"بدون قسم محدد"}</div>
          </div>
        </div>
        <div class="info-grid">
          <div class="info-field"><div class="info-label">الرقم الوظيفي</div><div class="info-value">#${esc(selected.employeeNumber)}</div></div>
          <div class="info-field"><div class="info-label">العمر</div><div class="info-value">${selected.age?selected.age+' سنة':'—'}</div></div>
          <div class="info-field"><div class="info-label">سنوات الخبرة</div><div class="info-value">${selected.experience!=null?selected.experience+' سنة':'—'}</div></div>
          <div class="info-field"><div class="info-label">تاريخ الالتحاق</div><div class="info-value">${fmtDate(selected.joinDate)}</div></div>
        </div>
      </div>
      <div class="section-title">رصيد الإجازات</div>
      <div class="leave-cards">${Object.keys(LEAVE_TYPES).map(key=>{
        const t = LEAVE_TYPES[key]; const l = selected.leaves[key];
        return `<div class="leave-card" style="border-top-color:${t.color}">
          <div class="lt-title" style="color:${t.color}">إجازة ${t.label}</div>
          <div style="font-size:12px;color:var(--ink-soft);">الرصيد: ${l.balance} · المستخدم: ${l.taken}</div>
          <div class="rem-pill" style="background:${t.light};color:${t.color};margin-top:8px;"><span>المتبقي</span><span>${remaining(l)}</span></div>
        </div>`;
      }).join("")}</div>
      `}
    </main>
  </div>`;
}

function renderPending(){
  return `
  <div class="content">
    <div class="empty-state">
      <div style="font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;color:var(--ink);margin-bottom:6px;">حسابك بانتظار التفعيل</div>
      <div style="font-size:13px;">تم تسجيل دخولك بنجاح، لكن ما عندك صلاحية محددة بعد. تواصل مع مدير النظام عشان يفعّل حسابك.</div>
    </div>
  </div>`;
}

/* ============== AUTH (Supabase) ============== */
async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ currentUserEmail = session.user.email; await showApp(); }
  else { showLogin(); }
}
function showLogin(){
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("mainApp").style.display = "none";
}
async function submitLogin(){
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-pass").value;
  const btn = document.getElementById("login-submit-btn");
  const errBox = document.getElementById("login-error");
  errBox.style.display = "none";
  if(!email || !password){ errBox.textContent = "أدخل البريد وكلمة المرور"; errBox.style.display = "block"; return; }
  btn.disabled = true; btn.textContent = "جارِ الدخول...";
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = "دخول";
  if(error){
    errBox.textContent = "بيانات الدخول غير صحيحة أو الحساب غير موجود.";
    errBox.style.display = "block";
    return;
  }
  currentUserEmail = data.user.email;
  await showApp();
}
async function logout(){
  await sb.auth.signOut();
  currentUserEmail = "";
  currentUserId = "";
  currentUserRole = null;
  currentUserEmployeeId = null;
  showLogin();
}
async function showApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  document.getElementById("userEmailLabel").textContent = currentUserEmail;

  const { data: { session } } = await sb.auth.getSession();
  currentUserId = session ? session.user.id : "";

  const { data: profile } = await sb.from("profiles").select("*").eq("id", currentUserId).maybeSingle();
  currentUserRole = profile ? profile.role : null;
  currentUserEmployeeId = profile ? profile.employee_id : null;
  currentUserManagedDeptId = profile ? profile.managed_department_id : null;

  await loadAll();
  applyRoleUI();

  if(currentUserRole === "admin"){
    setPage("home");
  } else if(currentUserRole === "manager"){
    setPage("myteam");
  } else if(currentUserRole === "employee"){
    setPage("org");
  } else {
    setPage("pending");
  }
}
function applyRoleUI(){
  const isAdmin = currentUserRole === "admin";
  const isManager = currentUserRole === "manager";
  const isEmployee = currentUserRole === "employee";
  document.getElementById("tab-home").style.display = isAdmin ? "" : "none";
  document.getElementById("tab-leaves").style.display = isAdmin ? "" : "none";
  document.getElementById("tab-reports").style.display = isAdmin ? "" : "none";
  document.getElementById("tab-users").style.display = isAdmin ? "" : "none";
  document.getElementById("tab-myprofile").style.display = isEmployee ? "" : "none";
  document.getElementById("tab-myteam").style.display = isManager ? "" : "none";
  document.getElementById("newEmployeeBtn").style.display = isAdmin ? "" : "none";
  document.getElementById("backupBtn").style.display = isAdmin ? "" : "none";
}

/* ============== INIT ============== */
checkSession();
</script>
</body>
